<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #212121;
    --panel: #2f2f2f;
    --text: #ececec;
    --muted: #9b9b9b;
    --border: #3a3a3a;
    --accent: #10a37f;
    --code-bg: #0d0d0d;
    --code-head: #1e1e1e;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: .95rem;
  }

  header .title {
    font-weight: 600;
  }

  #status {
    color: var(--muted);
    font-size: .8rem;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
  }

  .row {
    max-width: 760px;
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    gap: 14px;
  }

  .row.user {
    justify-content: flex-end;
  }

  .avatar {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    display: grid;
    place-items: center;
    font-size: .75rem;
    font-weight: 700;
    color: #fff;
    margin-top: 2px;
  }

  .bubble {
    min-width: 0;
    line-height: 1.6;
    font-size: .97rem;
  }

  .row.user .bubble {
    background: var(--panel);
    padding: 10px 16px;
    border-radius: 18px;
    max-width: 80%;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .row.bot .bubble {
    flex: 1;
  }

  .text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin: 0;
  }

  .text + .codeblock,
  .codeblock + .text {
    margin-top: 10px;
  }

  .text code {
    background: #3a3a3a;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: .88em;
  }

  .codeblock {
    background: var(--code-bg);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .codehead {
    background: var(--code-head);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    font-size: .78rem;
    color: var(--muted);
  }

  .codehead button {
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    font-size: .78rem;
  }

  .codehead button:hover {
    color: var(--text);
  }

  pre {
    margin: 0;
    padding: 14px;
    overflow-x: auto;
  }

  pre code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: .86rem;
    line-height: 1.5;
    white-space: pre;
    tab-size: 4;
    display: block;
  }

  .typing::after {
    content: "▍";
    animation: blink 1s steps(2) infinite;
    margin-left: 2px;
  }

  @keyframes blink {
    50% {
      opacity: 0;
    }
  }

  #empty {
    text-align: center;
    margin-top: 18vh;
    color: var(--muted);
  }

  #empty h2 {
    color: var(--text);
    font-weight: 600;
  }

  footer {
    padding: 10px 20px 18px;
  }

  #composer {
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 26px;
    display: flex;
    align-items: flex-end;
    padding: 8px 8px 8px 18px;
    gap: 8px;
  }

  #input {
    flex: 1;
    background: none;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
    resize: none;
    max-height: 200px;
    padding: 8px 0;
    line-height: 1.4;
  }

  #send {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 0;
    background: #fff;
    color: #000;
    cursor: pointer;
    font-size: 1rem;
    flex: none;
  }

  #send:disabled {
    opacity: .35;
    cursor: default;
  }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: .72rem;
    margin-top: 8px;
  }
</style>
</head>

<body>

<header>
  <span class="title">SmolLM 135M Instruct</span>
  <span id="status">Cargando modelo…</span>
</header>

<div id="chat">

  <div id="empty">
    <h2>¿En qué puedo ayudarte?</h2>
    <p>Modelo local ejecutándose en tu navegador (WASM).</p>
  </div>

</div>

<footer>

  <div id="composer">

    <textarea
      id="input"
      rows="1"
      placeholder="Escribe un mensaje…"
      disabled
    ></textarea>

    <button
      id="send"
      disabled
      title="Enviar"
    >➤</button>

  </div>

  <div class="hint">
    Enter envía · Shift+Enter nueva línea. Un modelo de 135M puede equivocarse.
  </div>

</footer>



<script type="module">
import {
  pipeline,
  TextStreamer,
  env
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm";

/* =========================================================
   CONFIG
========================================================= */

const MODEL_ID = "onnx-community/SmolLM-135M-Instruct-ONNX";

const MAX_NEW_TOKENS = 256;
const NUM_THREADS = 1;

/*
 * SmolLM-135M-Instruct:
 *
 * hidden_size          = 576
 * layers               = 30
 * attention_heads      = 9
 * kv_heads             = 3
 * head_dim             = 64
 * context              = 2048
 * vocab                = 49152
 *
 * No necesitamos declarar estos valores manualmente:
 * Transformers.js los obtiene de config.json.
 */

/* =========================================================
   WASM
========================================================= */

env.backends.onnx.wasm.numThreads = NUM_THREADS;

/*
 * El modelo se mantiene remoto y Transformers.js
 * utiliza su caché del navegador.
 */
env.allowRemoteModels = true;
env.allowLocalModels = false;
env.useWasmCache = true;

/* =========================================================
   ELEMENTOS HTML
   Intentamos encontrar los nombres habituales para no
   obligarte a modificar tu HTML.
========================================================= */

const input =
  document.querySelector("#userInput") ||
  document.querySelector("#prompt") ||
  document.querySelector("#messageInput") ||
  document.querySelector("textarea") ||
  document.querySelector("input[type='text']");

const sendButton =
  document.querySelector("#sendBtn") ||
  document.querySelector("#sendButton") ||
  document.querySelector("#send") ||
  document.querySelector("button[type='submit']");

const chat =
  document.querySelector("#chat") ||
  document.querySelector("#messages") ||
  document.querySelector("#chatMessages") ||
  document.querySelector(".chat");

const status =
  document.querySelector("#status") ||
  document.querySelector("#modelStatus") ||
  document.querySelector("#loadingStatus");

const progress =
  document.querySelector("#progress") ||
  document.querySelector("#downloadProgress");

if (!input) {
  console.error("No se encontró el campo de entrada.");
}

if (!sendButton) {
  console.error("No se encontró el botón de enviar.");
}

if (!chat) {
  console.error("No se encontró el contenedor del chat.");
}

/* =========================================================
   ESTADO
========================================================= */

let generator = null;
let modelReady = false;
let generating = false;

/* =========================================================
   UI
========================================================= */

function setStatus(text) {
  if (status) {
    status.textContent = text;
  }

  console.log("[SmolLM]", text);
}

function setProgress(value, text = null) {
  const percent = Math.max(0, Math.min(100, value));

  if (progress) {
    /*
     * Funciona tanto si #progress es <progress>
     * como si es un elemento normal.
     */
    if ("value" in progress) {
      progress.value = percent;
    }

    progress.style.width = `${percent}%`;

    if (text) {
      progress.textContent = text;
    }
  }

  if (status && text) {
    status.textContent = text;
  }
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function addMessage(role, text) {
  if (!chat) return null;

  const wrapper = document.createElement("div");

  wrapper.className =
    role === "user"
      ? "message user-message"
      : "message assistant-message";

  wrapper.dataset.role = role;

  wrapper.innerHTML = `
    <div class="message-content">${escapeHTML(text)}</div>
  `;

  chat.appendChild(wrapper);

  chat.scrollTop = chat.scrollHeight;

  return wrapper.querySelector(".message-content");
}

/* =========================================================
   PROGRESO DE DESCARGA
========================================================= */

function handleProgress(info) {
  if (!info) return;

  /*
   * Transformers.js proporciona información de progreso
   * durante la descarga/carga de los archivos.
   */
  if (typeof info.progress === "number") {
    const percent = info.progress;

    let label = `Descargando modelo: ${percent.toFixed(1)}%`;

    if (info.file) {
      label += ` — ${info.file}`;
    }

    setProgress(percent, label);
    return;
  }

  /*
   * Algunos eventos informan del archivo que se está
   * cargando pero todavía no tienen porcentaje.
   */
  if (info.status === "initiate") {
    setStatus(
      info.file
        ? `Preparando ${info.file}...`
        : "Preparando modelo..."
    );
  }

  if (info.status === "done") {
    if (info.file) {
      setStatus(`Cargado: ${info.file}`);
    }
  }
}

/* =========================================================
   CREACIÓN DEL PIPELINE
========================================================= */

async function loadModel() {
  if (generator) {
    return generator;
  }

  setStatus("Inicializando WASM...");
  setProgress(0, "Inicializando WASM...");

  /*
   * q8:
   *
   * Transformers.js busca la variante cuantizada.
   * En este repo corresponde a:
   *
   * onnx/model_quantized.onnx
   *
   * ~136 MB
   *
   * No utilizamos model_int8.onnx directamente.
   */
  generator = await pipeline(
    "text-generation",
    MODEL_ID,
    {
      device: "wasm",
      dtype: "q8",

      progress_callback: handleProgress
    }
  );

  setStatus("Modelo cargado. Preparando WASM...");

  return generator;
}

/* =========================================================
   WARM-UP
========================================================= */

async function warmup() {
  if (!generator) {
    await loadModel();
  }

  setStatus("Calentando el modelo...");

  /*
   * Una generación mínima fuerza a preparar:
   *
   * - tokenizer
   * - modelo
   * - sesión ONNX
   * - backend WASM
   * - operadores
   * - memoria interna
   *
   * No guardamos este contexto para las siguientes
   * preguntas.
   */
  await generator(
    [
      {
        role: "user",
        content: "Hola"
      }
    ],
    {
      max_new_tokens: 1,
      do_sample: false
    }
  );

  modelReady = true;

  setProgress(100, "Modelo listo");

  console.log(
    `[SmolLM] listo — WASM ${NUM_THREADS} hilos`
  );
}

/* =========================================================
   GENERACIÓN
========================================================= */

async function generateAnswer(text, outputElement) {
  if (!generator || !modelReady) {
    throw new Error("El modelo todavía no está listo.");
  }

  let generatedText = "";

  const streamer = new TextStreamer(
    generator.tokenizer,
    {
      skip_prompt: true,

      callback_function: (token) => {
        if (!token) return;

        generatedText += token;

        /*
         * Actualizamos únicamente el contenido del mensaje.
         *
         * NO reconstruimos todo el chat con innerHTML.
         * Esto evita gran parte del lag que tenías antes.
         */
        if (outputElement) {
          outputElement.textContent = generatedText;

          if (chat) {
            chat.scrollTop = chat.scrollHeight;
          }
        }
      }
    }
  );

  /*
   * IMPORTANTE:
   *
   * Solo pasamos el mensaje actual.
   *
   * No hay history.
   * No se reutilizan conversaciones anteriores.
   */
  await generator(
    [
      {
        role: "user",
        content: text
      }
    ],
    {
      max_new_tokens: MAX_NEW_TOKENS,

      do_sample: true,
      temperature: 0.7,
      top_p: 0.9,

      streamer
    }
  );

  return generatedText;
}

/* =========================================================
   ENVIAR
========================================================= */

async function sendMessage() {
  if (generating) return;
  if (!modelReady) return;

  if (!input) return;

  const text = input.value.trim();

  if (!text) return;

  generating = true;

  /*
   * No usamos Stop.
   * Simplemente bloqueamos otro envío mientras
   * la generación está en curso.
   */
  if (sendButton) {
    sendButton.disabled = true;
  }

  input.disabled = true;

  addMessage("user", text);

  const outputElement = addMessage("assistant", "");

  input.value = "";

  setStatus("Generando...");

  const startTime = performance.now();

  try {
    await generateAnswer(text, outputElement);

    const elapsed =
      ((performance.now() - startTime) / 1000).toFixed(2);

    setStatus(`Listo · ${elapsed}s`);
  } catch (error) {
    console.error(error);

    if (outputElement) {
      outputElement.textContent =
        "Error durante la generación: " +
        (error?.message || error);
    }

    setStatus("Error durante la generación.");
  }

  input.disabled = false;

  if (sendButton) {
    sendButton.disabled = false;
  }

  generating = false;

  input.focus();
}

/* =========================================================
   EVENTOS
========================================================= */

if (sendButton) {
  sendButton.addEventListener("click", (event) => {
    event.preventDefault();
    sendMessage();
  });
}

if (input) {
  input.addEventListener("keydown", (event) => {
    /*
     * Enter = enviar
     * Shift+Enter = nueva línea
     */
    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }
  });
}

/* =========================================================
   INICIO
========================================================= */

(async () => {
  try {
    await loadModel();

    await warmup();

    if (input) {
      input.disabled = false;
      input.focus();
    }

    if (sendButton) {
      sendButton.disabled = false;
    }

  } catch (error) {
    console.error(
      "[SmolLM] Error inicializando:",
      error
    );

    setStatus(
      "Error cargando el modelo: " +
      (error?.message || error)
    );

    if (sendButton) {
      sendButton.disabled = true;
    }
  }
})();
</script>
</body>
</html>
