<!DOCTYPE html>
<html lang="es">
<head>
  <script src="coi-serviceworker.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quitar fondo (u2netp)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f4f4f6; color: #222; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  #status { margin: 10px 0; font-size: .9rem; color: #555; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #e3e3ea; cursor: pointer; font-size: .9rem; }
  button:hover:not(:disabled) { background: #d4d4e0; }
  button.active { background: #4f46e5; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #stage { background: #fff; padding: 10px; border-radius: 10px; display: inline-block; max-width: 100%; box-sizing: border-box; }
  /* Cuadrícula para que se note la transparencia */
  canvas {
    max-width: 100%; height: auto; display: block; border-radius: 6px;
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%),
      linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
  }
</style>
</head>
<body>
<h1>Quitar fondo (u2netp, WASM)</h1>
<input type="file" id="file" accept="image/jpeg,image/png">
<div id="status">Cargando modelo…</div>

<div class="bar">
  <button id="bOrig" disabled>Original</button>
  <button id="bCut" disabled>Sin fondo</button>
  <button id="bMask" disabled>Máscara</button>
  <button id="bDl" disabled>Descargar PNG</button>
</div>

<div id="stage"><canvas id="canvas" width="400" height="300"></canvas></div>

<script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs';

ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
ort.env.wasm.numThreads = navigator.hardwareConcurrency || 1;

const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const statusEl = $('status');
const btns = { orig: $('bOrig'), cut: $('bCut'), mask: $('bMask') };
const SIZE = 320;
const MEAN = [0.485, 0.456, 0.406], STD = [0.229, 0.224, 0.225];

let session, img;
let cutout = null, maskView = null; // canvas al tamaño original

async function loadModel() {
  try {
    session = await ort.InferenceSession.create('u2netp.onnx', { executionProviders: ['wasm'] });
    statusEl.textContent = 'Modelo listo. Sube una foto.';
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Error cargando u2netp.onnx (¿está junto al HTML y usas un servidor local?): ' + e.message;
  }
}

function preprocess() {
  const c = document.createElement('canvas');
  c.width = c.height = SIZE;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0, SIZE, SIZE);
  const px = cx.getImageData(0, 0, SIZE, SIZE).data;
  let max = 1;
  for (let i = 0; i < px.length; i += 4) max = Math.max(max, px[i], px[i + 1], px[i + 2]);
  const n = SIZE * SIZE, out = new Float32Array(3 * n);
  for (let i = 0; i < n; i++)
    for (let ch = 0; ch < 3; ch++)
      out[ch * n + i] = (px[i * 4 + ch] / max - MEAN[ch]) / STD[ch];
  return new ort.Tensor('float32', out, [1, 3, SIZE, SIZE]);
}

// u2netp devuelve 7 salidas (d0..d6). d0 es el mapa final fusionado: la mejor.
async function getMask() {
  const res = await session.run({ [session.inputNames[0]]: preprocess() });
  const d = res[session.outputNames[0]].data;
  let min = Infinity, max = -Infinity;
  for (const v of d) { if (v < min) min = v; if (v > max) max = v; }
  const m = new Uint8ClampedArray(d.length);
  for (let i = 0; i < d.length; i++) m[i] = ((d[i] - min) / (max - min || 1)) * 255;
  return m;
}

function buildResults(m) {
  const W = img.naturalWidth, H = img.naturalHeight;

  // 1) Máscara 320x320 con la máscara en el canal alfa
  const small = document.createElement('canvas');
  small.width = small.height = SIZE;
  const sctx = small.getContext('2d');
  const id = sctx.createImageData(SIZE, SIZE);
  for (let i = 0; i < m.length; i++) id.data.set([255, 255, 255, m[i]], i * 4);
  sctx.putImageData(id, 0, 0);

  // 2) Redimensionar la máscara al tamaño original (interpolación suave)
  const big = document.createElement('canvas');
  big.width = W; big.height = H;
  const bctx = big.getContext('2d');
  bctx.imageSmoothingEnabled = true;
  bctx.imageSmoothingQuality = 'high';
  bctx.drawImage(small, 0, 0, W, H);

  // 3) Foto original recortada con la máscara (destination-in conserva solo donde hay alfa)
  cutout = document.createElement('canvas');
  cutout.width = W; cutout.height = H;
  const cctx = cutout.getContext('2d');
  cctx.drawImage(img, 0, 0, W, H);
  cctx.globalCompositeOperation = 'destination-in';
  cctx.drawImage(big, 0, 0);

  // 4) Vista de la máscara en blanco y negro
  maskView = document.createElement('canvas');
  maskView.width = W; maskView.height = H;
  const mctx = maskView.getContext('2d');
  mctx.fillStyle = '#000';
  mctx.fillRect(0, 0, W, H);
  mctx.drawImage(big, 0, 0);
}

function show(mode) {
  const src = mode === 'orig' ? img : mode === 'cut' ? cutout : maskView;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
  for (const k in btns) btns[k].classList.toggle('active', k === mode);
}

btns.orig.onclick = () => show('orig');
btns.cut.onclick = () => show('cut');
btns.mask.onclick = () => show('mask');
$('bDl').onclick = () => {
  cutout.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'sin_fondo.png';
    a.click();
  }, 'image/png');
};

$('file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file || !session) return;
  img = new Image();
  img.onload = async () => {
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    ctx.drawImage(img, 0, 0);
    [...Object.values(btns), $('bDl')].forEach(b => b.disabled = true);
    statusEl.textContent = 'Segmentando…';
    const t0 = performance.now();
    try {
      buildResults(await getMask());
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Error al segmentar: ' + err.message;
      return;
    }
    [...Object.values(btns), $('bDl')].forEach(b => b.disabled = false);
    statusEl.textContent = `Listo en ${((performance.now() - t0) / 1000).toFixed(1)} s.`;
    show('cut');
  };
  img.src = URL.createObjectURL(file);
});

loadModel();
</script>
</body>
</html>
